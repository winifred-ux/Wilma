<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set new password · Wilma</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #fafaf9; --surface: #ffffff; --surface-2: #f7f7f5;
  --border: #e8e8e5; --rule: #f0f0ec;
  --ink: #0a0a09; --ink-2: #4a4a47; --ink-3: #888884;
  --accent: #1a3d6e; --scam: #b91c1c; --scam-bg: #fef2f2;
  --legit: #15803d; --legit-bg: #f0fdf4;
  --warning: #ca8a04; --warning-bg: #fefce8;
  --shadow-3: 0 24px 48px -16px rgba(10,10,9,.12), 0 4px 12px -4px rgba(10,10,9,.06), 0 0 0 1px rgba(10,10,9,.04);
  --grid-color: rgba(10,10,9,.03);
  --bloom: radial-gradient(60% 50% at 50% 0%, rgba(26,61,110,.08), transparent 70%);
}
[data-theme="dark"], :root:not([data-theme="light"]) {
  --bg: #08090b; --surface: #111316; --surface-2: #15171b;
  --border: #1f2228; --rule: #181a1f;
  --ink: #f5f5f4; --ink-2: #a3a3a0; --ink-3: #6b6b67;
  --accent: #6da4d8; --scam: #f87171; --scam-bg: rgba(248,113,113,.12);
  --legit: #4ade80; --legit-bg: rgba(74,222,128,.12);
  --warning: #facc15; --warning-bg: rgba(250,204,21,.12);
  --shadow-3: 0 24px 48px -16px rgba(0,0,0,.7), 0 4px 12px -4px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04);
  --grid-color: rgba(255,255,255,.03);
  --bloom: radial-gradient(60% 50% at 50% 0%, rgba(109,164,216,.10), transparent 70%);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
.auth-shell {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 40px 24px;
  position: relative;
}
.auth-shell::before {
  content: ""; position: absolute; inset: 0;
  background-image: var(--bloom), radial-gradient(circle at 1px 1px, var(--grid-color) 1px, transparent 0);
  background-size: auto, 24px 24px; background-position: center top, 0 0;
  -webkit-mask-image: linear-gradient(180deg, black 60%, transparent 100%);
  pointer-events: none;
}
.auth-card {
  position: relative; width: 100%; max-width: 440px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; box-shadow: var(--shadow-3);
  padding: 40px 36px;
}
.auth-brand {
  display: inline-flex; align-items: center; gap: 9px;
  font-weight: 600; font-size: 16px; margin-bottom: 32px;
}
.auth-brand svg { width: 26px; height: 26px; color: var(--accent); }
.auth-title { font-size: 26px; font-weight: 600; margin: 0 0 8px; }
.auth-sub { color: var(--ink-2); font-size: 14px; margin: 0 0 28px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
.field input {
  width: 100%; padding: 11px 14px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface-2); color: var(--ink);
  font-family: inherit; font-size: 14px;
}
.field input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.btn-submit {
  width: 100%; padding: 12px 20px; border-radius: 9px;
  background: var(--ink); color: var(--bg); border: 1px solid var(--ink);
  font-size: 14px; font-weight: 500; margin-top: 6px;
}
.btn-submit:hover { background: var(--ink-2); }
.btn-submit:disabled { opacity: 0.6; cursor: wait; }
.auth-foot { margin-top: 24px; text-align: center; font-size: 13px; color: var(--ink-2); }
.auth-foot a { color: var(--accent); font-weight: 500; }
.auth-msg {
  margin-top: 14px; padding: 11px 14px; border-radius: 8px;
  font-size: 13px; display: none;
}
.auth-msg.show { display: block; }
.auth-msg.error { background: var(--scam-bg); color: var(--scam); }
.auth-msg.success { background: var(--legit-bg); color: var(--legit); }
.auth-msg.info { background: var(--warning-bg); color: var(--warning); }
.loading { color: var(--ink-3); text-align: center; padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="/" class="auth-brand"><svg viewBox="0 0 32 32" fill="none"><path d="M4 7L9.5 24L16 13L22.5 24L28 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Wilma</span></a>
    <h1 class="auth-title">Set a new password</h1>
    <p class="auth-sub" id="subtitle">Verifying your reset link…</p>

    <div id="loading-state" class="loading">Loading…</div>

    <form id="form" style="display: none;">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" minlength="6" placeholder="At least 6 characters" required>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" minlength="6" placeholder="Re-enter password" required>
      </div>
      <button type="submit" class="btn-submit" id="submit-btn">Update password</button>
      <div class="auth-msg" id="msg"></div>
    </form>

    <div class="auth-foot">Remembered it? <a href="/signin.html">Sign in</a></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://upapunmvqqwdkqdfckjr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_sohMwjK8tRBxren6rtbfaQ_1ijB4dcd";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Theme persistence
  try {
    const t = localStorage.getItem("wilma-theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}

  const subtitle = document.getElementById("subtitle");
  const loadingEl = document.getElementById("loading-state");
  const form = document.getElementById("form");
  const msg = document.getElementById("msg");

  function showMsg(text, kind) { msg.className = "auth-msg show " + (kind || ""); msg.textContent = text; }
  function clearMsg() { msg.className = "auth-msg"; msg.textContent = ""; }

  // When the recovery link is clicked, Supabase auto-creates a temporary session
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") {
      subtitle.textContent = "Choose a new password for your account.";
      loadingEl.style.display = "none";
      form.style.display = "block";
    }
  });

  // Also check if there's already a recovery session (in case event fired before listener attached)
  (async function() {
    setTimeout(async () => {
      const { data } = await sb.auth.getSession();
      if (data.session && form.style.display === "none") {
        // Session exists — assume recovery flow
        subtitle.textContent = "Choose a new password for your account.";
        loadingEl.style.display = "none";
        form.style.display = "block";
      } else if (!data.session) {
        subtitle.textContent = "This reset link is invalid or expired.";
        loadingEl.textContent = "Request a new password reset link.";
        loadingEl.innerHTML = '<a href="/reset-password.html" style="color: var(--accent); font-weight: 500;">Request a new reset link</a>';
      }
    }, 1500);
  })();

  form.addEventListener("submit", async function(e) {
    e.preventDefault();
    clearMsg();
    const newPwd = document.getElementById("password").value;
    const confirmPwd = document.getElementById("confirm").value;
    if (newPwd.length < 6) { showMsg("Password must be at least 6 characters.", "error"); return; }
    if (newPwd !== confirmPwd) { showMsg("Passwords don't match.", "error"); return; }
    const btn = document.getElementById("submit-btn");
    btn.disabled = true; btn.textContent = "Updating…";
    const { error } = await sb.auth.updateUser({ password: newPwd });
    if (error) {
      showMsg(error.message || "Could not update password.", "error");
      btn.disabled = false; btn.textContent = "Update password";
      return;
    }
    showMsg("Password updated! Please sign in with your new password.", "success");
    // Force sign-out so user has to authenticate fresh with new password
    await sb.auth.signOut();
    setTimeout(() => { window.location.href = "/signin.html"; }, 1800);
  });
</script>
</body>
</html>

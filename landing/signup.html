<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up · Wilma</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #fafaf9; --bg-2: #f4f4f1;
  --surface: #ffffff; --surface-2: #f7f7f5;
  --border: #e8e8e5; --rule: #f0f0ec;
  --ink: #0a0a09; --ink-2: #4a4a47; --ink-3: #888884;
  --accent: #1a3d6e; --accent-2: #2a5594;
  --scam: #b91c1c; --scam-bg: #fef2f2;
  --legit: #15803d; --legit-bg: #f0fdf4;
  --warning: #ca8a04; --warning-bg: #fefce8;
  --shadow-3: 0 24px 48px -16px rgba(10,10,9,.12), 0 4px 12px -4px rgba(10,10,9,.06), 0 0 0 1px rgba(10,10,9,.04);
  --grid-color: rgba(10,10,9,.03);
  --bloom: radial-gradient(60% 50% at 50% 0%, rgba(26,61,110,.08), transparent 70%);
}
[data-theme="dark"], :root:not([data-theme="light"]) {
  --bg: #08090b; --bg-2: #0c0d10;
  --surface: #111316; --surface-2: #15171b;
  --border: #1f2228; --rule: #181a1f;
  --ink: #f5f5f4; --ink-2: #a3a3a0; --ink-3: #6b6b67;
  --accent: #6da4d8; --accent-2: #87b6e3;
  --scam: #f87171; --scam-bg: rgba(248,113,113,.12);
  --legit: #4ade80; --legit-bg: rgba(74,222,128,.12);
  --warning: #facc15; --warning-bg: rgba(250,204,21,.12);
  --shadow-3: 0 24px 48px -16px rgba(0,0,0,.7), 0 4px 12px -4px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04);
  --grid-color: rgba(255,255,255,.03);
  --bloom: radial-gradient(60% 50% at 50% 0%, rgba(109,164,216,.10), transparent 70%);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #fafaf9; --bg-2: #f4f4f1;
    --surface: #ffffff; --surface-2: #f7f7f5;
    --border: #e8e8e5; --rule: #f0f0ec;
    --ink: #0a0a09; --ink-2: #4a4a47; --ink-3: #888884;
    --accent: #1a3d6e; --accent-2: #2a5594;
    --scam: #b91c1c; --scam-bg: #fef2f2;
    --legit: #15803d; --legit-bg: #f0fdf4;
    --warning: #ca8a04; --warning-bg: #fefce8;
    --shadow-3: 0 24px 48px -16px rgba(10,10,9,.12), 0 4px 12px -4px rgba(10,10,9,.06), 0 0 0 1px rgba(10,10,9,.04);
    --grid-color: rgba(10,10,9,.03);
    --bloom: radial-gradient(60% 50% at 50% 0%, rgba(26,61,110,.08), transparent 70%);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-feature-settings: "ss01", "cv11", "tnum";
  background: var(--bg); color: var(--ink); line-height: 1.5;
  -webkit-font-smoothing: antialiased; letter-spacing: -0.011em; min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
.auth-shell {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 40px 24px;
  position: relative;
}
.auth-shell::before {
  content: ""; position: absolute; inset: 0;
  background-image: var(--bloom), radial-gradient(circle at 1px 1px, var(--grid-color) 1px, transparent 0);
  background-size: auto, 24px 24px; background-position: center top, 0 0;
  -webkit-mask-image: linear-gradient(180deg, black 60%, transparent 100%);
  mask-image: linear-gradient(180deg, black 60%, transparent 100%);
  pointer-events: none;
}
.auth-card {
  position: relative; width: 100%; max-width: 440px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; box-shadow: var(--shadow-3);
  padding: 40px 36px;
}
.auth-brand {
  display: inline-flex; align-items: center; gap: 9px;
  font-weight: 600; font-size: 16px; letter-spacing: -0.022em;
  margin-bottom: 32px; color: var(--ink);
}
.auth-brand svg { width: 26px; height: 26px; color: var(--accent); }
.auth-title { font-size: 26px; font-weight: 600; letter-spacing: -0.025em; margin: 0 0 8px; line-height: 1.15; }
.auth-sub { color: var(--ink-2); font-size: 14px; margin: 0 0 28px; line-height: 1.55; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; letter-spacing: -0.005em; }
.field-input-wrap { position: relative; }
.field input {
  width: 100%; padding: 11px 14px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface-2); color: var(--ink);
  font-family: inherit; font-size: 14px;
  transition: border-color 120ms, background 120ms;
}
.field input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.field input::placeholder { color: var(--ink-3); }
.field-with-toggle input { padding-right: 44px; }
.eye-btn {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 32px; height: 32px; border: none; background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-3); border-radius: 6px; cursor: pointer;
  transition: color 120ms, background 120ms;
}
.eye-btn:hover { color: var(--ink); background: var(--surface); }
.eye-btn svg { width: 18px; height: 18px; }
.field-aux { display: flex; justify-content: flex-end; margin-top: 6px; font-size: 12.5px; }
.field-aux a { color: var(--accent); font-weight: 500; }
.btn-submit {
  width: 100%; padding: 12px 20px; border-radius: 9px;
  background: var(--ink); color: var(--bg); border: 1px solid var(--ink);
  font-size: 14px; font-weight: 500; margin-top: 6px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-submit:hover { background: var(--ink-2); }
.btn-submit:disabled { opacity: 0.6; cursor: wait; }
.spinner {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent;
  animation: spin 0.7s linear infinite; display: none;
}
.btn-submit[data-loading="true"] .spinner { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.divider {
  display: flex; align-items: center; gap: 14px;
  margin: 24px 0 18px; color: var(--ink-3); font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.btn-magic {
  width: 100%; padding: 11px 18px; border-radius: 9px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-magic:hover { border-color: var(--ink-3); }
.btn-magic svg { width: 16px; height: 16px; color: var(--accent); }
.auth-foot { margin-top: 24px; text-align: center; font-size: 13px; color: var(--ink-2); }
.auth-foot a { color: var(--accent); font-weight: 500; }
.auth-msg {
  margin-top: 14px; padding: 11px 14px; border-radius: 8px;
  font-size: 13px; display: none; line-height: 1.5;
}
.auth-msg.show { display: block; }
.auth-msg.error { background: var(--scam-bg); color: var(--scam); }
.auth-msg.success { background: var(--legit-bg); color: var(--legit); }
.auth-msg.info { background: var(--warning-bg); color: var(--warning); }
</style>
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="/" class="auth-brand"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 7L9.5 24L16 13L22.5 24L28 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Wilma</span></a>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-sub">Track every classification and access your dashboard.</p>
    <form id="signup-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <div class="field-input-wrap">
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>
      </div>
      <div class="field field-with-toggle">
        <label for="password">Password</label>
        <div class="field-input-wrap">
          <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
          <button type="button" class="eye-btn" id="pwd-toggle" aria-label="Show password"><svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button type="submit" class="btn-submit" id="submit-btn">
        <span class="spinner"></span>
        <span class="btn-label">Sign up</span>
      </button>
      <div class="auth-msg" id="msg"></div>
    </form>
    <div class="divider">or</div>
    <button type="button" class="btn-magic" id="magic-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span>Email me a magic link</span></button>
    <div class="auth-foot">Already have an account? <a href="/signin.html">Sign in</a></div>
  </div>
</div>
<script>

  const SUPABASE_URL = "https://upapunmvqqwdkqdfckjr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_sohMwjK8tRBxren6rtbfaQ_1ijB4dcd";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // theme
  try {
    const t = localStorage.getItem("wilma-theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}

  function showMsg(el, text, kind) { el.className = "auth-msg show " + (kind || ""); el.textContent = text; }
  function clearMsg(el) { el.className = "auth-msg"; el.textContent = ""; }
  function humanize(err) {
    if (!err) return "Something went wrong. Please try again.";
    const msg = (err.message || "").toLowerCase();
    if (msg.includes("invalid login credentials")) return "Wrong email or password. Try again, or reset your password.";
    if (msg.includes("email not confirmed")) return "Please confirm your email first. Check your inbox for the confirmation link.";
    if (msg.includes("user already registered")) return "An account with this email already exists. Try signing in instead.";
    if (msg.includes("password should be at least")) return "Password must be at least 6 characters.";
    if (msg.includes("invalid")) return "That doesn't look like a valid email address.";
    return err.message || "Something went wrong.";
  }

  // password toggle
  function setupEyeToggle(inputId, btnId) {
    const input = document.getElementById(inputId);
    const btn = document.getElementById(btnId);
    if (!input || !btn) return;
    const svg = btn.querySelector("svg");
    btn.addEventListener("click", function() {
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      if (showing) {
        svg.innerHTML = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
      } else {
        svg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      }
      input.focus();
    });
  }
  setupEyeToggle("password", "pwd-toggle");


  const form = document.getElementById("signup-form");
  const submit = document.getElementById("submit-btn");
  const label = submit.querySelector(".btn-label");
  const msg = document.getElementById("msg");

  form.addEventListener("submit", async function(e) {
    e.preventDefault();
    clearMsg(msg);
    const email = form.email.value.trim();
    const password = form.password.value;
    if (!email || !password) { showMsg(msg, "Please fill in both email and password.", "error"); return; }
    submit.disabled = true; submit.dataset.loading = "true"; label.textContent = "Creating account…";
    try {
      const { data, error } = await sb.auth.signUp({ email: email, password: password });
      if (error) {
        showMsg(msg, humanize(error), "error");
        submit.disabled = false; submit.dataset.loading = "false"; label.textContent = "Sign up";
        return;
      }
      showMsg(msg, "Almost there! Check your email (" + email + ") for a confirmation link. After confirming, sign in to access your dashboard.", "success");
      submit.disabled = false; submit.dataset.loading = "false"; label.textContent = "Sign up";
      form.reset();
    } catch (err) {
      showMsg(msg, "Network error. Check your internet and try again.", "error");
      submit.disabled = false; submit.dataset.loading = "false"; label.textContent = "Sign up";
    }
  });

  document.getElementById("magic-btn").addEventListener("click", async function() {
    const email = form.email.value.trim();
    if (!email) { showMsg(msg, "Type your email above first, then we'll send the magic link.", "info"); return; }
    clearMsg(msg);
    const { error } = await sb.auth.signInWithOtp({ email: email });
    if (error) { showMsg(msg, humanize(error), "error"); return; }
    showMsg(msg, "Check your email for the sign-in link.", "success");
  });
</script>
</body>
</html>

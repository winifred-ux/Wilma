<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Wilma</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #fafaf9; --bg-2: #f4f4f1;
  --surface: #ffffff; --surface-2: #f7f7f5;
  --border: #e8e8e5; --rule: #f0f0ec;
  --ink: #0a0a09; --ink-2: #4a4a47; --ink-3: #888884;
  --accent: #1a3d6e; --accent-2: #2a5594;
  --scam: #b91c1c; --scam-bg: #fef2f2;
  --legit: #15803d; --legit-bg: #f0fdf4;
  --warning: #ca8a04; --warning-bg: #fefce8;
  --shadow-3: 0 24px 48px -16px rgba(10,10,9,.12), 0 4px 12px -4px rgba(10,10,9,.06), 0 0 0 1px rgba(10,10,9,.04);
  --grid-color: rgba(10,10,9,.03);
  --bloom: radial-gradient(60% 50% at 50% 0%, rgba(26,61,110,.08), transparent 70%);
}
[data-theme="dark"], :root:not([data-theme="light"]) {
  --bg: #08090b; --bg-2: #0c0d10;
  --surface: #111316; --surface-2: #15171b;
  --border: #1f2228; --rule: #181a1f;
  --ink: #f5f5f4; --ink-2: #a3a3a0; --ink-3: #6b6b67;
  --accent: #6da4d8; --accent-2: #87b6e3;
  --scam: #f87171; --scam-bg: rgba(248,113,113,.12);
  --legit: #4ade80; --legit-bg: rgba(74,222,128,.12);
  --warning: #facc15; --warning-bg: rgba(250,204,21,.12);
  --shadow-3: 0 24px 48px -16px rgba(0,0,0,.7), 0 4px 12px -4px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04);
  --grid-color: rgba(255,255,255,.03);
  --bloom: radial-gradient(60% 50% at 50% 0%, rgba(109,164,216,.10), transparent 70%);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #fafaf9; --bg-2: #f4f4f1;
    --surface: #ffffff; --surface-2: #f7f7f5;
    --border: #e8e8e5; --rule: #f0f0ec;
    --ink: #0a0a09; --ink-2: #4a4a47; --ink-3: #888884;
    --accent: #1a3d6e; --accent-2: #2a5594;
    --scam: #b91c1c; --scam-bg: #fef2f2;
    --legit: #15803d; --legit-bg: #f0fdf4;
    --warning: #ca8a04; --warning-bg: #fefce8;
    --shadow-3: 0 24px 48px -16px rgba(10,10,9,.12), 0 4px 12px -4px rgba(10,10,9,.06), 0 0 0 1px rgba(10,10,9,.04);
    --grid-color: rgba(10,10,9,.03);
    --bloom: radial-gradient(60% 50% at 50% 0%, rgba(26,61,110,.08), transparent 70%);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-feature-settings: "ss01", "cv11", "tnum";
  background: var(--bg); color: var(--ink); line-height: 1.5;
  -webkit-font-smoothing: antialiased; letter-spacing: -0.011em; min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
.auth-shell {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 40px 24px;
  position: relative;
}
.auth-shell::before {
  content: ""; position: absolute; inset: 0;
  background-image: var(--bloom), radial-gradient(circle at 1px 1px, var(--grid-color) 1px, transparent 0);
  background-size: auto, 24px 24px; background-position: center top, 0 0;
  -webkit-mask-image: linear-gradient(180deg, black 60%, transparent 100%);
  mask-image: linear-gradient(180deg, black 60%, transparent 100%);
  pointer-events: none;
}
.auth-card {
  position: relative; width: 100%; max-width: 440px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; box-shadow: var(--shadow-3);
  padding: 40px 36px;
}
.auth-brand {
  display: inline-flex; align-items: center; gap: 9px;
  font-weight: 600; font-size: 16px; letter-spacing: -0.022em;
  margin-bottom: 32px; color: var(--ink);
}
.auth-brand svg { width: 26px; height: 26px; color: var(--accent); }
.auth-title { font-size: 26px; font-weight: 600; letter-spacing: -0.025em; margin: 0 0 8px; line-height: 1.15; }
.auth-sub { color: var(--ink-2); font-size: 14px; margin: 0 0 28px; line-height: 1.55; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; letter-spacing: -0.005em; }
.field-input-wrap { position: relative; }
.field input {
  width: 100%; padding: 11px 14px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface-2); color: var(--ink);
  font-family: inherit; font-size: 14px;
  transition: border-color 120ms, background 120ms;
}
.field input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.field input::placeholder { color: var(--ink-3); }
.field-with-toggle input { padding-right: 44px; }
.eye-btn {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 32px; height: 32px; border: none; background: transparent;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-3); border-radius: 6px; cursor: pointer;
  transition: color 120ms, background 120ms;
}
.eye-btn:hover { color: var(--ink); background: var(--surface); }
.eye-btn svg { width: 18px; height: 18px; }
.field-aux { display: flex; justify-content: flex-end; margin-top: 6px; font-size: 12.5px; }
.field-aux a { color: var(--accent); font-weight: 500; }
.btn-submit {
  width: 100%; padding: 12px 20px; border-radius: 9px;
  background: var(--ink); color: var(--bg); border: 1px solid var(--ink);
  font-size: 14px; font-weight: 500; margin-top: 6px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-submit:hover { background: var(--ink-2); }
.btn-submit:disabled { opacity: 0.6; cursor: wait; }
.spinner {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent;
  animation: spin 0.7s linear infinite; display: none;
}
.btn-submit[data-loading="true"] .spinner { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.divider {
  display: flex; align-items: center; gap: 14px;
  margin: 24px 0 18px; color: var(--ink-3); font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.btn-magic {
  width: 100%; padding: 11px 18px; border-radius: 9px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-magic:hover { border-color: var(--ink-3); }
.btn-magic svg { width: 16px; height: 16px; color: var(--accent); }
.auth-foot { margin-top: 24px; text-align: center; font-size: 13px; color: var(--ink-2); }
.auth-foot a { color: var(--accent); font-weight: 500; }
.auth-msg {
  margin-top: 14px; padding: 11px 14px; border-radius: 8px;
  font-size: 13px; display: none; line-height: 1.5;
}
.auth-msg.show { display: block; }
.auth-msg.error { background: var(--scam-bg); color: var(--scam); }
.auth-msg.success { background: var(--legit-bg); color: var(--legit); }
.auth-msg.info { background: var(--warning-bg); color: var(--warning); }

  .hist-row {
    display: grid; grid-template-columns: 80px 1fr 80px 70px;
    gap: 12px; align-items: center;
    padding: 12px 0; border-top: 1px solid var(--rule);
    font-size: 13px;
  }
  .hist-row:first-child { border-top: none; }
  .hist-pill {
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500;
    padding: 3px 8px; border-radius: 6px;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", monospace;
  }
  .hist-pill.legit { background: var(--legit-bg); color: var(--legit); }
  .hist-pill.scam { background: var(--scam-bg); color: var(--scam); }
  .hist-text {
    color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hist-conf {
    font-family: ui-monospace, monospace;
    color: var(--ink-2); font-size: 12px;
    text-align: right;
  }
  .hist-time {
    color: var(--ink-3); font-size: 11px;
    text-align: right;
  }
  .hist-empty {
    color: var(--ink-3); font-size: 13px; font-style: italic;
    padding: 18px 0; text-align: center;
  }

</style>
</head>
<body>
<style>
  .dash-shell { max-width: 880px; margin: 0 auto; padding: 60px 28px; }
  .dash-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; }
  .dash-brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; letter-spacing: -0.022em; }
  .dash-brand svg { width: 26px; height: 26px; color: var(--accent); }
  .dash-actions { display: flex; gap: 10px; align-items: center; }
  .btn-secondary {
    padding: 8px 14px; border-radius: 8px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--border);
    font-size: 13px; font-weight: 500;
  }
  .btn-secondary:hover { border-color: var(--ink-3); }
  .dash-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 32px; margin-bottom: 16px; }
  .dash-card h2 { margin: 0 0 12px; font-size: 17px; font-weight: 600; }
  .dash-card p { margin: 0 0 6px; color: var(--ink-2); font-size: 14px; line-height: 1.6; }
  .dash-meta { display: grid; grid-template-columns: 100px 1fr; gap: 8px 16px; font-size: 13px; }
  .dash-meta dt { color: var(--ink-3); font-weight: 500; }
  .dash-meta dd { color: var(--ink); margin: 0; word-break: break-all; font-family: ui-monospace, monospace; font-size: 12px; }
  .dash-empty { color: var(--ink-3); font-size: 13px; font-style: italic; padding: 18px 0; text-align: center; }
</style>
<div class="dash-shell">
  <header class="dash-head">
    <a href="/" class="dash-brand"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 7L9.5 24L16 13L22.5 24L28 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Wilma</span></a>
    <div class="dash-actions">
      <a href="/" class="btn-secondary">Home</a>
      <a href="/settings.html" class="btn-secondary">Settings</a>
      <button class="btn-secondary" id="signout-btn">Sign out</button>
    </div>
  </header>
  <div class="dash-card">
    <h2 id="welcome-title">Welcome</h2>
    <p id="welcome-text">Loading…</p>
  </div>
  <div class="dash-card">
    <h2>Account</h2>
    <dl class="dash-meta">
      <dt>Email</dt><dd id="meta-email">—</dd>
      <dt>User ID</dt><dd id="meta-id">—</dd>
      <dt>Joined</dt><dd id="meta-joined">—</dd>
    </dl>
  </div>
  <div class="dash-card">
    <h2>Classification history</h2>
    <p id="history-summary" style="margin-bottom: 18px;">Loading your history…</p>
    <div id="history-list"></div>
  </div>
</div>
<script>
  const SUPABASE_URL = "https://upapunmvqqwdkqdfckjr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_sohMwjK8tRBxren6rtbfaQ_1ijB4dcd";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  try {
    const t = localStorage.getItem("wilma-theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}

  (async function() {
    const { data } = await sb.auth.getSession();
    if (!data.session) { window.location.href = "/signin.html"; return; }
    const u = data.session.user;
    const displayName = (u.user_metadata && u.user_metadata.display_name) ? u.user_metadata.display_name.split(" ")[0] : u.email.split("@")[0];
    document.getElementById("welcome-title").textContent = "Hi, " + displayName + " 👋";
    document.getElementById("welcome-text").textContent = "You're signed in. Wilma will start saving every classification you run on this account.";
    document.getElementById("meta-email").textContent = u.email;
    document.getElementById("meta-id").textContent = u.id;
    document.getElementById("meta-joined").textContent = new Date(u.created_at).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });

    // Load classification history
    const { data: rows, error: histErr } = await sb
      .from("classifications")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(20);

    const summary = document.getElementById("history-summary");
    const list = document.getElementById("history-list");
    if (histErr) {
      summary.textContent = "Could not load history.";
      console.warn("History error:", histErr);
      return;
    }
    if (!rows || rows.length === 0) {
      summary.textContent = "Every message you classify will be saved to your account.";
      list.innerHTML = '<div class="hist-empty">No classifications yet — try one on the home page.</div>';
      return;
    }

    const total = rows.length;
    const scams = rows.filter(r => r.is_scam).length;
    summary.textContent = "Your last " + total + " classifications (" + scams + " flagged as scam):";

    list.innerHTML = rows.map(r => {
      const cls = r.is_scam ? "scam" : "legit";
      const verdict = (r.verdict || "").replace(/_/g, " ");
      const conf = (r.confidence * 100).toFixed(1) + "%";
      const text = r.text.length > 80 ? r.text.slice(0, 80) + "…" : r.text;
      const when = new Date(r.created_at);
      const time = when.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + ", " +
                   when.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
      return '<div class="hist-row">' +
        '<span class="hist-pill ' + cls + '">' + verdict + '</span>' +
        '<span class="hist-text">' + text.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</span>' +
        '<span class="hist-conf">' + conf + '</span>' +
        '<span class="hist-time">' + time + '</span>' +
      '</div>';
    }).join("");
  })();

  document.getElementById("signout-btn").addEventListener("click", async function() {
    await sb.auth.signOut();
    window.location.href = "/signin.html";
  });
</script>
</body>
</html>
